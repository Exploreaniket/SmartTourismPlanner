<!-- =======================================================
                    FEATURE MODAL
======================================================== -->

<div class="modal fade"
     id="featureModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content feature-modal">

            <!-- Header -->

            <div class="modal-header border-0">

                <div class="d-flex align-items-center gap-3">

                    <div class="modal-icon">

                        <i id="modalIcon"
                           class="fa-solid fa-robot"></i>

                    </div>

                    <div>

                        <h3 id="modalTitle" class="mb-1">

                            AI Journey Planner

                        </h3>

                        <small id="modalSubtitle">

                            Smart Tourism Planner

                        </small>

                    </div>

                </div>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>

            <!-- Body -->

            <div class="modal-body">

                <p id="modalDescription">

                    Description goes here.

                </p>

                <div class="row mt-4">

                    <div class="col-md-6">

                        <ul id="featureListLeft"
                            class="feature-list">
                        </ul>

                    </div>

                    <div class="col-md-6">

                        <ul id="featureListRight"
                            class="feature-list">
                        </ul>

                    </div>

                </div>

            </div>

            <!-- Footer -->

            <div class="modal-footer border-0">

                <button
                    type="button"
                    class="btn btn-light"
                    data-bs-dismiss="modal">

                    Close

                </button>

                <a href="#planner"
                   id="modalButton"
                   class="btn btn-primary">

                    Try Now

                </a>

            </div>

        </div>

    </div>

</div>
